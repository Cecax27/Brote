<section class="bg-surface border border-border rounded-xl p-xl shadow-sm relative overflow-hidden">

<!-- Input Field: New Password -->
<div class="space-y-xs">
<label class="block font-label-md text-text-main px-xs" for="password">Nueva contraseña</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">lock</span>

</div>
</div>
<!-- Input Field: Confirm Password -->
<div class="space-y-xs">
<label class="block font-label-md text-text-main px-xs" for="confirm-password">Confirmar contraseña</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">verified_user</span>
<input class="w-full bg-background border border-border rounded-[20px] py-md pl-12 pr-md font-body-md text-text-main placeholder:text-outline focus:border-primary-soft transition-all duration-300" id="confirm-password" placeholder="••••••••" type="password"/>

                        </li>

<span class="material-symbols-outlined text-outline text-[16px]">circle</span>

</button>

<!-- Micro-interaction Script -->
<script>
        document.getElementById('reset-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalContent = btn.innerHTML;
            
            // Visual feedback for interaction
            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Actualizando...';
            
            setTimeout(() => {
                btn.classList.replace('bg-primary', 'bg-terracotta');
                btn.innerHTML = '<span class="material-symbols-outlined">check</span> ¡Contraseña guardada!';
                
                setTimeout(() => {
                    // Reset or Redirect simulation
                    btn.disabled = false;
                    btn.classList.replace('bg-terracotta', 'bg-primary');
                    btn.innerHTML = originalContent;
                }, 2000);
            }, 1500);
        });

        // Soft focus animation for icons
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.previousElementSibling.classList.replace('text-outline', 'text-primary');
            });
            input.addEventListener('blur', () => {
                input.previousElementSibling.classList.replace('text-primary', 'text-outline');
            });
        });
    </script>
