<!-- Simple Micro-interactions -->
<script>
        // Simple scale effect for input interaction
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.parentElement.classList.add('scale-[1.01]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.parentElement.classList.remove('scale-[1.01]');
            });
        });

        // Floating animation for the watercolor elements
        const bgElements = document.querySelectorAll('.watercolor-bg div');
        window.addEventListener('mousemove', (e) => {
            const mouseX = e.clientX / window.innerWidth - 0.5;
            const mouseY = e.clientY / window.innerHeight - 0.5;
            
            bgElements.forEach((el, index) => {
                const speed = (index + 1) * 20;
                const x = mouseX * speed;
                const y = mouseY * speed;
                el.style.transform = `translate(${x}px, ${y}px) rotate(${index === 0 ? 12 : 0}deg)`;
            });
        });
    </script>
