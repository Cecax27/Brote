<style>

        @keyframes perkUp {

<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('forgot-password-form');
            const button = form.querySelector('button');

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                
                // Visual feedback on submit
                button.disabled = true;
                button.innerHTML = `
                    <div class="flex items-center justify-center gap-2">
                        <span class="material-symbols-outlined animate-spin">refresh</span>
                        Enviando...
                    </div>
                `;

                // Simulate API call
                setTimeout(() => {
                    button.classList.remove('bg-primary');
                    button.classList.add('bg-primary-soft');
                    button.innerHTML = `
                        <div class="flex items-center justify-center gap-2">
                            <span class="material-symbols-outlined">check_circle</span>
                            Enviado con éxito
                        </div>
                    `;
                    
                    // Show a toast or message
                    const successMsg = document.createElement('p');
                    successMsg.className = 'text-center text-primary font-label-md mt-4 animate-bounce';
                    successMsg.textContent = '¡Revisa tu bandeja de entrada!';
                    form.appendChild(successMsg);
                }, 1500);
            });

            // Focus states interaction for the leaf
            const emailInput = document.getElementById('email');
            const leaf = document.querySelector('.leaf-animate');

            emailInput.addEventListener('focus', () => {
                leaf.style.animationDuration = '1.5s';
                leaf.style.filter = 'drop-shadow(0 0 8px rgba(69, 99, 67, 0.2))';
            });

            emailInput.addEventListener('blur', () => {
                leaf.style.animationDuration = '3s';
                leaf.style.filter = 'none';
            });
        });
    </script>
