<!-- Branding/Icon (Optional) -->
<div class="mb-xl text-center md:text-left">
<span class="material-symbols-outlined text-primary text-4xl mb-md">eco</span>
</div>

<h1 class="font-display text-display-lg text-text-main mb-sm">
                    Te extrañábamos
                </h1>
<p class="font-body-lg text-text-secondary">
                    Tus plantas están ansiosas por verte.
                </p>
</header>
<!-- Login Form -->
<form class="space-y-md" onsubmit="event.preventDefault();">
<div class="space-y-xs">
<label class="font-label-md text-text-main ml-xs" for="email">Correo electrónico</label>
<input class="w-full h-14 px-md bg-surface border border-border rounded-2xl font-body-md text-text-main placeholder:text-outline/50 transition-all" id="email" placeholder="tu@correo.com" type="email"/>
</div>
<div class="space-y-xs">
<div class="flex justify-between items-center px-xs">
<label class="font-label-md text-text-main" for="password">Contraseña</label>
<a class="font-label-md text-primary hover:underline transition-all" href="#">Olvidé mi contraseña</a>
</div>
<input class="w-full h-14 px-md bg-surface border border-border rounded-2xl font-body-md text-text-main placeholder:text-outline/50 transition-all" id="password" placeholder="••••••••" type="password"/>
</div>
<div class="pt-sm">
<button class="w-full h-14 bg-primary text-on-primary rounded-3xl font-label-md text-lg btn-hover shadow-sm" type="submit">
                        Entrar al jardín
                    </button>
</div>
</form>
<!-- Divider -->
<div class="relative my-xl">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-border"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-md bg-background text-text-secondary font-label-md uppercase tracking-wider">O continúa con</span>

</div>

<span>Google</span>

<svg class="w-5 h-5 fill-[#1877F2]" viewbox="0 0 24 24">
<path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"></path>

</p>

</main>
<!-- Micro-interaction script -->
<script>
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('label').style.color = '#456343';
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('label').style.color = '#3F3A36';
            });
        });

        // Simple form validation visual cue
        const loginBtn = document.querySelector('button[type="submit"]');
        loginBtn.addEventListener('click', (e) => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            
            if(!email || !pass) {
                loginBtn.classList.add('bg-error');
                loginBtn.innerText = 'Por favor, completa los campos';
                setTimeout(() => {
                    loginBtn.classList.remove('bg-error');
                    loginBtn.innerText = 'Entrar al jardín';
                }, 2000);
            }
        });
    </script>
