name: Bug Report
description: Report a bug or unexpected behavior
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the details below so we can understand and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: "When I tap on X, Y happens instead of Z..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Steps to trigger the bug.
      placeholder: |
        1. Go to '...'
        2. Tap on '...'
        3. Scroll to '...'
        4. See the error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
      placeholder: "I expected the app to..."
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: If applicable, add screenshots or screen recordings to help explain the problem.

  - type: input
    id: app_version
    attributes:
      label: App version
      description: The version of Brote you are using (check in Settings > About).
      placeholder: "e.g. 0.1.0"

  - type: input
    id: device
    attributes:
      label: Device and OS
      description: What device and operating system are you using?
      placeholder: "e.g. iPhone 15, iOS 18.2"

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other information that might help us diagnose the issue.
